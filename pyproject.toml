[project]
name = "github-trend-pipeline"
version = "0.1.0"
description = ""
authors = [
    {name = "kal1nadam",email = "kalinaadam75@seznam.cz"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-cloud-bigquery (>=3.40.0,<4.0.0)",
    "fastapi (>=0.128.0,<0.129.0)",
    "uvicorn (>=0.40.0,<0.41.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pytest-mock = ">=3.14.0"
ruff = ">=0.9.0"
httpx = ">=0.27.0"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
